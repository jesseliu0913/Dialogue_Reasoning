task: maze
dataset_path: JesseLiu/MedQA_Maze
output_type: generate_until
fewshot_split: validation
test_split: test
num_fewshot: 3
doc_to_text: !function maze.doc_to_text
doc_to_target: !function maze.doc_to_target
process_results: !function maze.process_results
metric_list:
  - metric: f1
    aggregation: mean
    higher_is_better: true
  - metric: bleu
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  max_length: 2048
  do_sample: false
  until:
    - "QUESTION:"